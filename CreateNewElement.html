<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM part Three - How to create a new element in DOM</title>
  </head>
  <body style="background-color: #212121; color: #fff">
    <h1>createElement(), createTextNode(),textContent</h1>
  </body>
  <script>
    // const h1 = document.createElement("h1");
    // console.log(h1); // <h1></h1>
    const div = document.createElement("div");
    console.log(div); // <div></div>

    // Adding class and id
    div.className = "main";
    // div.id = "myId";
    div.id = Math.round(Math.random() * 10 + 1); // for a random id
    console.log(div); // <div class="main" id="5"></div>

    // adding Attributes in that
    div.setAttribute("title", "generated title");
    console.log(div); // <div class="main" id="7" title="generated title"></div>
    div.style.backgroundColor = "orange";
    div.style.padding = "20px";

    // adding the text inside this div
    // div.innerText = "Chai or code";
    // console.log(div);

    // Now we are creating a text for this div
    const addText = document.createTextNode("chai or code");
    div.appendChild(addText);
    console.log(div);

    // adding div tag inside body
    document.body.appendChild(div);
  </script>
</html>
