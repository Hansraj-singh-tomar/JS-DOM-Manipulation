<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM part four - Edit and Remove element in DOM</title>
  </head>
  <body style="background-color: #212121; color: #fff">
    <h1>remove(), replaceWith(), outerHTML, textContent, appendChild()</h1>
    <ul class="language">
      <li>Javascript</li>
    </ul>
  </body>
  <script>
    function addLanguage(langName) {
      const li = document.createElement("li");
      li.innerHTML = `${langName}`;
      document.querySelector(".language").appendChild(li);
    }

    addLanguage("React");

    // ye optimize way hai - isme hame tree ko jyada traverse nhi karna pda
    function addOptiLanguage(langName) {
      const li = document.createElement("li");
      const addText = document.createTextNode(langName);
      li.appendChild(addText);
      document.querySelector(".language").appendChild(li);
    }
    addOptiLanguage("next js");

    // Edit second element of this list
    const secondLang = document.querySelector("li:nth-child(2)");
    // secondLang.innerHTML = "Mojo";
    // optimize way
    const newLi = document.createElement("li");
    newLi.textContent = "Node";
    secondLang.replaceWith(newLi);

    // Edit first element
    const firstLang = document.querySelector("li:first-child");
    firstLang.outerHTML = `<li>TypeScript</li>`;

    // Remove
    const lastLang = document.querySelector("li:last-child");
    lastLang.remove();
  </script>
</html>
